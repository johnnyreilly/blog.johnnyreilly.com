name: Automerge Gatekeeper

on:
  pull_request:
    types: [opened, edited, synchronize]

# Explicitly lock down the GITHUB_TOKEN to the bare minimum required
permissions:
  contents: read
  pull-requests: read

jobs:
  check-automated:
    runs-on: ubuntu-latest
    name: Check automated
    steps:
      - name: Verify PR Metadata and Actor
        id: security_check
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          ACTOR="${{ github.actor }}"
          HEAD_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          BASE_REPO="${{ github.repository }}"
          BRANCH_NAME="${{ github.head_ref }}"

          echo "Evaluating PR #${{ github.event.pull_request.number }} from actor: $ACTOR"

          # 1. Verify the repository origin (Block external forks)
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "SECURITY WARN: Auto-merge is strictly forbidden for external forks."
            echo "allow_automerge=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. Verify the PR title format, the expected branch prefix, and the authenticated bot actor
          if [[ "$PR_TITLE" =~ ^chore\(deps\): ]] && [[ "$BRANCH_NAME" =~ ^renovate/ ]] && [[ "$ACTOR" == "renovate[bot]" ]]; then
            echo "SUCCESS: Verified automated dependency update from Renovate."
            echo "allow_automerge=true" >> $GITHUB_OUTPUT
          else
            echo "SECURITY WARN: Spoofing attempt or unauthorized manual PR detected."
            echo "allow_automerge=false" >> $GITHUB_OUTPUT
          fi

      # This step only passes for legitimate Renovate PRs
      - name: Allow Auto-Merge for verified PRs
        if: steps.security_check.outputs.allow_automerge == 'true'
        run: |
          echo "Gatekeeper passed successfully - PR #${{ github.event.pull_request.number }} is eligible for auto-merge."
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # This step explicitly fails to block status-check-dependent auto-mergers
      - name: Block Unauthorized Auto-Merge for unverified PRs
        if: steps.security_check.outputs.allow_automerge == 'false'
        run: |
          echo "::info::Auto-merge engine blocked for this pull request."
          gh pr merge ${{ github.event.pull_request.number }} --disable-auto --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
