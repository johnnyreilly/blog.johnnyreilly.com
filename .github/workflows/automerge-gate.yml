name: Automerge Gatekeeper

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]

# No `concurrency` group on purpose: this job is a required check, and a cancelled run
# leaves a cancelled "Auto-merge if eligible" check on the commit that blocks merging.
# Several runs per PR are normal (Renovate's label events), so instead each run reads
# the PR's current state from the API rather than its event payload - whichever run
# finishes last decides using up-to-date labels and title.

# Auto-merge is enabled with a GitHub App token, not GITHUB_TOKEN: merges made via
# GITHUB_TOKEN don't trigger `push` workflows, so the site would never deploy.
# GITHUB_TOKEN therefore only needs to read the repo.
permissions:
  contents: read
  pull-requests: read

jobs:
  check-automated:
    runs-on: ubuntu-latest
    name: Auto-merge if eligible
    steps:
      - name: Checkout 📥
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows

      # Criteria live in automergeRules.js - add new rules there
      - name: Check auto-merge eligibility
        id: check_automergable
        uses: actions/github-script@v9
        with:
          script: |
            const { evaluateAutomerge, toPullRequestInfo } = require('./.github/workflows/automergeRules.js');

            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            const result = evaluateAutomerge(toPullRequestInfo(context, pr));

            core.notice(result.reason, {
              title: result.eligible ? 'Eligible for auto-merge' : 'Not eligible for auto-merge',
            });
            await core.summary
              .addHeading(`PR #${pr.number} ${result.eligible ? 'is' : 'is not'} eligible for auto-merge`, 3)
              .addRaw(result.reason)
              .write();

            core.setOutput('allow_automerge', String(result.eligible));
            core.setOutput('managed', String(result.managed));
            core.setOutput('auto_merge_enabled', String(pr.auto_merge !== null));

      - name: Check GitHub App is configured 🔍
        id: app_configured
        env:
          APP_CLIENT_ID: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
        run: |
          if [ -z "$APP_CLIENT_ID" ]; then
            echo "::warning::AUTOMERGE_APP_CLIENT_ID secret is not set - skipping auto-merge changes."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Only needed to enable auto-merge, or to disable it on a managed PR that has it on -
      # otherwise a token problem would fail this required check on PRs with nothing to do
      - name: Create GitHub App token 🔑
        id: app_token
        if: steps.app_configured.outputs.configured == 'true' && (steps.check_automergable.outputs.allow_automerge == 'true' || (steps.check_automergable.outputs.managed == 'true' && steps.check_automergable.outputs.auto_merge_enabled == 'true'))
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge ✅
        if: steps.app_token.outcome == 'success' && steps.check_automergable.outputs.allow_automerge == 'true'
        run: gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # e.g. someone other than Renovate pushed to a Renovate PR after auto-merge was enabled
      - name: Disable auto-merge 🛑
        if: steps.app_token.outcome == 'success' && steps.check_automergable.outputs.allow_automerge == 'false' && steps.check_automergable.outputs.managed == 'true' && steps.check_automergable.outputs.auto_merge_enabled == 'true'
        run: gh pr merge "$PR_NUMBER" --disable-auto --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
