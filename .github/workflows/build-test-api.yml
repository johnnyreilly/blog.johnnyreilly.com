name: API build and test ⚙️

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  api_build_and_test_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: API build and test ⚙️
    steps:
      - name: Checkout 📥
        uses: actions/checkout@v7
        # This job only lints/builds/tests the API - no git history is needed,
        # so we use the default shallow (fetch-depth: 1) checkout for speed.

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: API build and test ⚙️
        run: |
          cd blog-website/api
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          npm test
