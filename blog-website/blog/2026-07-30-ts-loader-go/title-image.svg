<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#0F3C73"/>
      <stop offset="1" stop-color="#00ADD8"/>
    </linearGradient>
    <linearGradient id="panel" x1="317" y1="222" x2="883" y2="494" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1B32" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0F2740" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="630" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#B6C9FF" stroke-opacity="0.12"/>
    </pattern>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8AD3FF"/>
      <stop offset="1" stop-color="#00ADD8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1122" cy="74" r="158" fill="#00ADD8" fill-opacity="0.16"/>
  <circle cx="103" cy="552" r="205" fill="#8B5CF6" fill-opacity="0.12"/>

  <g opacity="0.8">
    <circle cx="150" cy="128" r="15" fill="#B8E0FF"/>
    <circle cx="1050" cy="150" r="15" fill="#9DEAD6"/>
    <path d="M165 128C360 128 420 150 700 150C820 150 940 150 1035 150" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
    <path d="M165 128C300 128 340 500 700 500C830 500 940 500 1035 150" stroke="url(#flow)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5" stroke-dasharray="1 12"/>
  </g>

  <g filter="url(#shadow)">
    <!-- TypeScript logo -->
    <rect x="450" y="60" width="102" height="102" rx="24" fill="#091224" fill-opacity="0.64" stroke="#D6E4FF" stroke-opacity="0.14"/>
    <image href="data:image/svg+xml;base64," x="463" y="73" width="76" height="76" preserveAspectRatio="xMidYMid meet"/>

    <!-- webpack logo -->
    <rect x="570" y="60" width="102" height="102" rx="24" fill="#091224" fill-opacity="0.64" stroke="#D6E4FF" stroke-opacity="0.14"/>
    <image href="data:image/svg+xml;base64," x="583" y="73" width="76" height="76" preserveAspectRatio="xMidYMid meet"/>

    <!-- Go chip -->
    <rect x="690" y="60" width="102" height="102" rx="24" fill="#091224" fill-opacity="0.64" stroke="#7FE7FF" stroke-opacity="0.3"/>
    <text x="741" y="128" fill="#00ADD8" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="800" text-anchor="middle">Go</text>

    <rect x="317" y="222" width="566" height="272" rx="32" fill="url(#panel)" stroke="#D6E4FF" stroke-opacity="0.16"/>
    <text x="355" y="300" fill="#F8FAFC" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="800">Migrating</text>
    <text x="355" y="364" fill="#F8FAFC" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="800">ts-loader to</text>
    <text x="355" y="428" fill="#7FE7FF" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="800">TypeScript 7.1</text>

    <rect x="355" y="446" width="230" height="60" rx="18" fill="#111827" fill-opacity="0.88" stroke="#93C5FD" stroke-opacity="0.3"/>
    <text x="380" y="484" fill="#F8FAFC" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="700">with AI ✦</text>
  </g>
</svg>
