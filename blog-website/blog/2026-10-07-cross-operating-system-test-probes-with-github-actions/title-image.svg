<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.6" stop-color="#161B22"/>
      <stop offset="1" stop-color="#1F3A5F"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#C9D1D9" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1080" cy="90" r="175" fill="#2F81F7" fill-opacity="0.10"/>
  <circle cx="110" cy="560" r="150" fill="#3FB950" fill-opacity="0.08"/>

  <text x="600" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#F0F6FC">Cross Operating System</text>
  <text x="600" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#F0F6FC">Test Probes with GitHub Actions</text>

  <!-- dispatch command -->
  <g filter="url(#shadow)">
    <rect x="190" y="220" width="820" height="64" rx="12" fill="#010409" stroke="#30363D"/>
    <text x="216" y="260" font-family="Menlo, Consolas, monospace" font-size="21" fill="#7EE787">$ <tspan fill="#C9D1D9">gh workflow run test-probe.yml -f os=</tspan><tspan fill="#79C0FF">all</tspan></text>
  </g>

  <!-- connectors -->
  <path d="M600 284V330M600 330H280V362M600 330H920V362M600 330V362" stroke="#8B949E" stroke-width="3" stroke-linecap="round"/>

  <!-- OS job cards -->
  <g filter="url(#shadow)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="150" y="362" width="260" height="150" rx="16" fill="#161B22" stroke="#30363D"/>
    <text x="280" y="418" text-anchor="middle" font-size="30" font-weight="600" fill="#F0F6FC">Ubuntu</text>
    <circle cx="280" cy="462" r="20" fill="#238636"/>
    <path d="M270 462l7 7 13-14" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="470" y="362" width="260" height="150" rx="16" fill="#161B22" stroke="#30363D"/>
    <text x="600" y="418" text-anchor="middle" font-size="30" font-weight="600" fill="#F0F6FC">macOS</text>
    <circle cx="600" cy="462" r="20" fill="#238636"/>
    <path d="M590 462l7 7 13-14" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="790" y="362" width="260" height="150" rx="16" fill="#161B22" stroke="#F85149" stroke-width="2"/>
    <text x="920" y="418" text-anchor="middle" font-size="30" font-weight="600" fill="#F0F6FC">Windows</text>
    <circle cx="920" cy="462" r="20" fill="#DA3633"/>
    <path d="M912 454l16 16M928 454l-16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="600" y="578" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="20" fill="#8B949E">C:\ vs / — find out in minutes, not hours</text>
</svg>
